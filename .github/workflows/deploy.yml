# .github/workflows/deploy.yml
name: Deploy React App to GitHub Pages

on:
  push:
    branches: [ main ]  # Change to 'master' if that's your default branch
  workflow_dispatch:    # Allows manual trigger from GitHub Actions tab

# Sets permissions for GitHub Pages deployment
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'  # Cache npm dependencies for faster builds

      - name: 📦 Install dependencies
        run: npm ci  # Clean install based on package-lock.json

      - name: 🔐 Load environment variables (optional)
        run: |
          echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" >> $GITHUB_ENV
        # ⚠️ Only do this if your app truly needs the key client-side
        # Better: proxy API calls through a backend to keep keys secret

      - name: 🏗️ Build Vite app for GitHub Pages
        run: npm run build
        env:
          # This tells your vite.config.js to use the correct base path
          GITHUB_PAGES: 'true'

      - name: ⚙️ Setup GitHub Pages
        uses: actions/configure-pages@v4

      - name: 📤 Upload build artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist  # Vite's default output directory

      - name: 🚀 Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4